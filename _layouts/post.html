<header class="article-title">

  {% if page.description %}<p class="print-description" hidden>{{ page.description }}</p>{% endif %}
  {% if page.date %}<p class="print-date" hidden>{{ page.date | date: site.date_format }}</p>{% endif %}
</header>

{{ content }}
