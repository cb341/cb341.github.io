# Editorial selection for glossary rendering; definitions and aliases live in
# glossary_definitions.yml. Set eligible to false to disable a piece's glossary.
# Eligible means that a brief, contextual definition would help readers follow
# the piece. Terms name concepts used in the source, rather than incidental
# products, people, or code identifiers. Small selections are intentional.
# Existing explanations can supply reminder hints; essential definitions
# should stay in the prose.

