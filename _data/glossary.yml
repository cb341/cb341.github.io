# Editorial selection for glossary rendering; definitions and aliases live in
# glossary_definitions.yml. Omit a source to disable its glossary.
# Readers are tech-blog readers comfortable with everyday computing and basic
# proof vocabulary, but not necessarily specialists in each article's subject.
# Select concepts needed to follow the piece; omit familiar vocabulary, ordinary
# words, incidental products, people, and code identifiers. Small selections are
# intentional. Prefer terms easy to confuse or specific to an unfamiliar field;
# omit concepts already explained sufficiently in the prose or formulas.
# Labels use canonical spellings and singular base forms; prose forms are aliases.
# Avoid broad aliases that could mark an ordinary use of a word in the source.
# Essential explanations stay in the prose; definitions are brief reminders.

