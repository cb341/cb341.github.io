# Definitions are plain text, context-free reminders: one sentence, about 20
# words or fewer. Article-specific meanings and examples belong in overrides.
# Labels use canonical spellings and singular base forms; aliases retain prose
# forms and match case-insensitively. Expansions appear in abbr titles, so do not
# repeat them in definitions. Define neutrally; corrections belong in the prose.
terms:
  ECS:
    expansion: Entity-component-system
    definition: An architecture where entities identify objects, components hold their data, and systems operate on that data.
    aliases: [Entity Component System, entity-component-system]
  data synchronization:
    definition: Keeping copies of shared state consistent across a server and its clients by exchanging updates.
    aliases: [synchronization, synchronizing, synchronising]
  binary message encoding:
    definition: Representing structured data as bytes for transmission or storage.
  ECS resource:
    definition: Data stored once per ECS world and shared by systems, rather than attached to individual entities.
    aliases: [resources]
  reliable channel:
    definition: A message channel that retransmits lost messages to deliver them while the connection remains active.
    aliases: [reliable channels, ReliableOrdered]
  unreliable channel:
    definition: A message channel that sends without retransmitting losses, allowing messages to be dropped or arrive out of order.
    aliases: [unreliable channels, Unreliable]
  frame rate:
    definition: The number of image frames rendered or displayed per second.
    aliases: [frame rates]

  terminal multiplexer:
    definition: A program that manages multiple terminal sessions, windows, and panes within one terminal interface.
  terminal emulator:
    definition: An application that displays terminal output and passes keyboard input to programs such as a shell.
    aliases: [terminal emulators]
  pane:
    definition: A region of a terminal multiplexer window displaying its own terminal session.
    aliases: [panes]
  prefix:
    definition: A key combination telling tmux to interpret the next key as a command.
  hook:
    definition: A command configured to run automatically when a particular event occurs.
    aliases: [hooks]
  tmux window:
    definition: A tmux container holding one or more panes within a session, separate from the terminal emulator's window.
    aliases: [windows]
  tmux layout:
    definition: The arrangement and relative sizes of panes within a tmux window.
    aliases: [layout, layouts]

  WebSocket:
    definition: A protocol maintaining an open connection so client and server can send messages in either direction.
    aliases: [Web Sockets, Web Socket, WebSockets]
  multiple publisher - multiple subscriber pattern:
    definition: The publish-subscribe (pub/sub) pattern lets multiple senders publish to a shared topic received by multiple subscribers.
  Turbo stream:
    definition: An HTML message describing a page change, such as appending or replacing an element, which Turbo applies.
    aliases: [Turbo streams]
  Stimulus controller:
    definition: A JavaScript class attached to HTML elements through data attributes to handle events and add behavior.
    aliases: [Stimulus controllers]
  HTML over the wire:
    definition: Sending server-rendered HTML to update a browser interface instead of transmitting data for client-side templating.
  broadcast:
    definition: Sending the same message to all connected clients or subscribers.
    aliases: [broadcasts, broadcasting, broadcasted]
  pub/sub topic:
    definition: A named message channel that publishers send to and subscribers listen to.
    aliases: [topic, topics]
  data attribute:
    definition: An HTML attribute prefixed with data- that stores custom values for scripts.
    aliases: [data attributes, data-attribute, data-attributes]

  voxel:
    definition: A volume element representing a cell in three-dimensional space, analogous to a pixel in an image.
    aliases: [voxels]
  meshing:
    definition: Generating vertices and faces that represent a surface for rendering.
  feature flag:
    definition: A switch that enables or disables selected functionality.
    aliases: [feature flags]
  composition over inheritance:
    definition: Building types by combining contained objects rather than inheriting behavior through a class hierarchy.
  trait:
    definition: A Rust interface specifying behavior that implementing types must provide.
    aliases: [traits]
  macro:
    definition: A rule or procedure that generates code during compilation.
    aliases: [macros]
  borrow checker:
    definition: Rust's compile-time analysis that checks references obey ownership and borrowing rules.
  zero-cost abstraction:
    definition: An abstraction that adds no runtime overhead compared with equivalent code written without it.
    aliases: [zero-cost abstractions, zero cost abstraction]
  metaprogramming:
    definition: Writing code that generates, inspects, or modifies other code or program structures.
  struct:
    definition: A Rust type grouping fields into a single value, with named, positional, or no fields.
    aliases: [structs]
  data race:
    definition: Concurrent memory accesses from multiple threads, at least one writing and one non-atomic, without adequate synchronization.
    aliases: [data races]
  language server:
    definition: A program providing editor features such as completion, diagnostics, and refactoring through a shared protocol.
    aliases: [language servers]

  alias:
    definition: A shell name that expands into other command text.
    aliases: [aliases]
  source:
    definition: Execute a shell file in the current shell, making its aliases, functions, and variables available there.
    aliases: [sourcing]

  box model:
    definition: CSS's description of an element as content surrounded by padding, a border, and margins.
  flexbox:
    definition: A CSS layout system arranging items along a main axis, with controls for alignment, spacing, and wrapping.
  grid:
    definition: A CSS layout system placing elements in rows and columns with control over tracks and gaps.
  inline style:
    definition: CSS declarations written directly in an HTML element's style attribute.
    aliases: [inline styles]
  SVG:
    expansion: Scalable Vector Graphics
    definition: An image format describing shapes and text as vectors, allowing scaling without pixelation.
    aliases: [SVGs]
  responsiveness:
    definition: A layout's ability to adapt to different viewport sizes while keeping content usable and readable.
  utility class:
    definition: A reusable CSS class that applies one focused styling rule, such as spacing or text alignment.
    aliases: [utility classes]
  accessibility:
    definition: Designing interfaces so people with disabilities can perceive, understand, navigate, and use them.

  chunking:
    definition: Splitting text into smaller parts that can each be processed within a model's input limit.
  context window:
    definition: The maximum number of tokens a language model can handle as input and output together in one request.
  token:
    definition: A text unit processed by a language model, such as a word, word fragment, or punctuation mark.
    aliases: [tokens]
  Kolmogorov complexity:
    definition: The length of the shortest program producing a given output, relative to a chosen universal computing system.
  precondition and postcondition:
    definition: A condition required before an operation runs, or guaranteed after it completes successfully.
    aliases: [pre/postcondition, pre/postconditions]
  data normalization:
    definition: Transforming data into a consistent representation for processing or comparison.
    aliases: [normalized, normalised]

  formal notation:
    definition: Symbols and rules with explicitly defined meanings, as in mathematics or diagramming languages.
  logographic:
    definition: Using written signs to represent words or meaningful units rather than individual speech sounds.
  relational algebra:
    definition: A formal language for operations on relations, including selecting rows, projecting columns, and joining relations.
  bag semantics:
    definition: Treating a collection as a multiset, allowing duplicate values.
  Typoglycaemia:
    definition: An informal name for recognizing words with scrambled internal letters, aided by context and familiar word structure.
  Shannon entropy:
    definition: The average information per outcome in a probability distribution, measuring its uncertainty.
  redundancy:
    definition: Predictable or repeated information that can be omitted while preserving the intended message.
  lossy:
    definition: Discarding information during compression or encoding, preventing exact reconstruction of the original.
  set semantics:
    definition: Treating a collection as a set, where each distinct value appears at most once.
    aliases: [set-based]
  UML composition:
    definition: A UML whole-part association with exclusive ownership, shown by a filled diamond, whose parts are deleted with their whole.
    aliases: [composition]
  UML aggregation:
    definition: A UML whole-part association shown by a hollow diamond, with grouping semantics defined by the model.
    aliases: [aggregation]
  shared context:
    definition: Knowledge, conventions, and assumptions shared by participants, allowing messages to leave some meaning implicit.

  umask:
    definition: A Unix mask that removes selected permission bits when files or directories are created.
  group-write permissions:
    definition: Permissions allowing a file's owning group to modify it, or create and remove entries in a directory.
    aliases: [group-write bit]
  bottle:
    definition: A prebuilt Homebrew package that can be installed without compiling from source.
    aliases: [bottles]
  formula:
    definition: A Homebrew package definition describing how to obtain, build, and install software.
    aliases: [formulae]
  cask:
    definition: A Homebrew package definition for installing software distributed as ready-made macOS applications or installers.
    aliases: [casks]
  System Integrity Protection:
    definition: A macOS security mechanism restricting changes to protected system locations and processes, including actions by root.
  launchd:
    definition: macOS's service manager for starting, stopping, and supervising background processes.
  MacPorts port:
    definition: A MacPorts package definition describing software sources, dependencies, and installation steps.
    aliases: [ports, port]
  daemon:
    definition: A background process that provides a service without an interactive user interface.
    aliases: [daemons]
  kernel extension:
    definition: A loadable module that adds functionality, such as hardware drivers, to an operating system's kernel.
    aliases: [kernel extensions]

  LLM:
    expansion: Large language model
    definition: A model trained on large amounts of text to generate and transform language using the context it receives.
    aliases: [LLMs]
  system prompt:
    definition: Instructions supplied to a language model to establish behavior and constraints across an interaction.
    aliases: [system prompts]
  low context:
    definition: A communication style expressing meaning directly in the message, with little reliance on shared background or implicit cues.
  asynchronous communication:
    definition: Communication where participants send and respond at different times without needing to be present together.
    aliases: [Async communication]
  direct feedback:
    definition: An evaluation style that states criticism explicitly and clearly.
  principles-first persuasion:
    definition: A persuasion style that presents general principles or theory before drawing conclusions and applying them to examples.
    aliases: [principles first, principles-first]
  egalitarian leadership:
    definition: A leadership style that minimizes status differences and encourages participation regardless of rank.
    aliases: [egalitarian]
  consensual decision-making:
    definition: A decision-making style that seeks broad agreement among participants before committing to a choice.
    aliases: [consensual]
  task-based trust:
    definition: A trust-building style where confidence develops through reliable work and demonstrated competence.
    aliases: [task based trust, task based, task-based]
  confrontational disagreement:
    definition: A disagreement style that treats open debate and challenge as normal parts of productive discussion.
    aliases: [confrontational]
  flexible scheduling:
    definition: A scheduling style that adapts plans and timing as circumstances change.
    aliases: [flexible time]

  witness:
    definition: An object supplied to establish that an existential statement holds.
    aliases: [witnesses]
  first-order theory:
    definition: A collection of axioms in a language whose quantifiers range over individual objects.
    aliases: [first-order arithmetic]
  induction schema:
    definition: A family of axioms asserting induction separately for each formula expressing a property of natural numbers.
  elaboration:
    definition: Lean's translation of source notation into fully specified terms, inferring information such as implicit arguments and types.
    aliases: [elaborates]
  opaque:
    definition: A Lean constant whose defining expression the kernel cannot unfold when checking definitional equality.
  unfolding:
    definition: Replacing a defined name with its defining expression.
    aliases: [unfold, unfolds, unfolded]
  reducible:
    definition: A Lean definition marked for automatic unfolding by the elaborator and tactics.
  definitionally equal:
    definition: Equal by the type system's computation and reduction rules, without a separate equality proof.
    aliases: [definitional reductions]
  tactic:
    definition: A command that builds a Lean proof by transforming goals and available hypotheses.
    aliases: [tactics]
  proof state:
    definition: The hypotheses currently available and the goals still to be proved.
  proof term:
    definition: A formal expression representing a proof, whose type is the statement being proved.

  truth table:
    definition: A table listing an operation's result for every possible input combination.
    aliases: [truth tables]
  bitwise operator:
    definition: An operation acting independently on corresponding bit positions, such as AND, OR, or XOR.
    aliases: [Bitwise operators]
  NAND:
    expansion: NOT AND
    definition: A logical operation returning zero only when both input bits are one.
  nibble:
    definition: A group of four bits, representing one of sixteen possible values.
    aliases: [nibbles]
  carry:
    definition: A value passed to a higher digit position when addition exceeds what the current position can represent.
  signed overflow:
    definition: An arithmetic result outside the range representable by the chosen signed integer width.
  two's complement:
    definition: A signed integer representation in which the highest bit has negative weight.
  MSB:
    expansion: Most significant bit
    definition: The highest-weight bit in an unsigned binary number, serving as the sign bit in two's complement.
    aliases: [most significant bit]
  multiplexer:
    definition: A circuit selecting one of several inputs using control bits.
    aliases: [multiplexers]
  ALU:
    expansion: Arithmetic logic unit
    definition: The part of a processor that performs arithmetic and logical operations on data.
  combinational divider:
    definition: A division circuit computing the result directly from its inputs without sequential clocked steps.
    aliases: [combinational dividers]
  fragment shader:
    definition: A GPU program computing output values, such as color, for fragments during rendering.
  restoring divider:
    definition: A divider that shifts and subtracts, restoring the previous partial remainder whenever a subtraction produces a negative result.
    aliases: [restoring dividers]
  sequential logic:
    definition: Digital logic whose outputs depend on current inputs and stored state.
  propagation depth:
    definition: The maximum number of successive logic stages a signal traverses from a circuit's inputs to its outputs.
  modular arithmetic:
    definition: Arithmetic that identifies numbers with the same remainder after division by a fixed modulus.
    aliases: [addition mod 256, mod]
  truncating integer division:
    definition: Integer division that discards the fractional part of the quotient, rounding toward zero.
    aliases: [truncating division, truncating]
  self-similarity:
    definition: A pattern's resemblance to itself at different scales.
    aliases: [self similarity]

  nihilism:
    definition: A family of philosophical views questioning or denying foundations of meaning, value, or knowledge.

  derivative:
    definition: A function's instantaneous rate of change with respect to a variable, defined by a limit of difference quotients.
    aliases: [derivatives]
  higher-order derivative:
    definition: A derivative obtained by differentiating a function repeatedly.
    aliases: [higher-order derivatives]
  discretization:
    definition: Replacing a continuous problem with a representation on discrete points or time steps for numerical computation.
  partial derivative:
    definition: A function's rate of change when one input variable varies while the others remain fixed.
    aliases: [partial derivatives]
  Jacobian matrix:
    definition: The matrix of first partial derivatives, with output components in rows and input variables in columns.
    aliases: [Jacobi matrix]
  comma derivative:
    definition: An indexed notation where a comma followed by an index denotes partial differentiation with respect to that coordinate.
  lifetime:
    definition: The scope over which a Rust reference remains valid.
    aliases: [lifetimes]

  RTG:
    expansion: Radioisotope thermoelectric generator
    definition: A device converting heat from radioactive decay into electricity using thermoelectric materials.
    aliases: [RTGs, radioisotope thermoelectric generators, radioisotope thermoelectric generator]
  plutonium-238 decay:
    definition: The radioactive transformation of plutonium-238 that releases heat used in radioisotope power systems.
  mutation:
    definition: A change in an organism's DNA sequence.
    aliases: [mutations]
  selective pressure:
    definition: An environmental factor affecting which heritable traits improve survival or reproductive success.
  DNA repair:
    definition: Cellular processes that identify and correct damage to DNA.
  directed evolution:
    definition: A laboratory method that repeatedly generates variation and selects variants with a desired property.

  orthography:
    definition: The conventions for writing a language, including spelling, capitalization, and punctuation.


  RFC:
    expansion: Request for Comments
    definition: A document in the series used to publish Internet technical specifications and related material.
    aliases: [RFCs]
  encoding:
    definition: Representing information using agreed symbols or rules so a decoder can reconstruct it.
    aliases: [encode/decode]

  anthropomorphism:
    definition: Attributing human characteristics, intentions, or behavior to something nonhuman.
    aliases: [anthropomorphized]
  trope:
    definition: A figure of speech that shifts words from their literal meaning, such as metaphor or metonymy.
    aliases: [tropes]
  metonymy:
    definition: Referring to something by a closely associated name, such as "the White House" for the US administration.
  synecdoche:
    definition: Referring to a whole by a part, or vice versa, such as "boots on the ground" for soldiers.
  personification:
    definition: Giving human qualities or actions to an abstraction or nonhuman thing.
  reification:
    definition: Treating an abstract concept as a concrete thing with independent existence or agency.
  chiasmus:
    definition: An A-B / B-A reversal of corresponding elements in phrases; repeating the same words in reverse is antimetabole.

  blitz:
    definition: Chess played with a short time limit for each player.
  Elo:
    definition: A rating system estimating relative playing strength from results against other players.
  pin:
    definition: A chess attack constraining a piece because moving it would expose a more valuable target behind it.
    aliases: [pins]
  skewer:
    definition: A chess attack on a valuable piece that exposes a piece behind it when it moves.
    aliases: [skewers]
  hanging piece:
    definition: A piece that can be captured without sufficient protection or compensation.
    aliases: [hanging pieces]
  passed pawn:
    definition: A pawn with no opposing pawn ahead on its file or an adjacent file.
    aliases: [passed pawns]
  prophylaxis:
    definition: In chess, anticipating and preventing the opponent's threats.
  opposition:
    definition: An endgame relationship between kings, often separated by one square, where the player to move may yield ground.
  square rule:
    definition: A geometric shortcut using an imaginary square to determine whether a king can catch an advancing passed pawn.

  NPV:
    expansion: Net present value
    definition: The sum of a project's expected cash inflows and outflows discounted to a common date, including the initial investment.
  discount factor:
    definition: A multiplier converting a future cashflow into its value at an earlier reference date.
    aliases: [discount factors]
  present value:
    definition: The value assigned today to a future cashflow using a chosen discount rate.
    aliases: [present values, Barwert, barwerte]
  floating point:
    definition: A finite-precision representation of numbers using a significand and an exponent.
    aliases: [floating-point]
  numerical error:
    definition: The difference introduced by numerical computation or approximation, including discretization, truncation, or rounding.
  model error:
    definition: The difference between a model's description or predictions and the reality it represents.
  general relativity:
    definition: Einstein's theory of gravity relating spacetime geometry to matter and energy.

  top-level domain:
    definition: A domain label directly below the DNS root, such as com, ch, or zip.
    aliases: [top-level domains, TLDs, TLD, gTLDs]
  delegation:
    definition: In DNS, assigning authority over part of the name hierarchy to designated authoritative name servers.
    aliases: [delegated]
  namespace:
    definition: A set of names and the rules governing what they identify.
  internationalized domain name:
    definition: A domain name supporting non-ASCII characters, with encoded DNS labels marked by the IDNA ACE prefix xn--.
    aliases: [internationalized domain names, IDN]
  homograph attack:
    definition: A deception using visually similar characters in a domain name to make one site resemble another.
    aliases: [homograph attacks]
  code point:
    definition: A numeric identifier for a position in Unicode's character space.
    aliases: [code points]
  Punycode:
    definition: An encoding representing Unicode strings using ASCII characters, used within internationalized domain labels.

