<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="Georgia, 'Times New Roman', serif" fill="#181818">
  <style>
    .lbl  { font-size: 17px; font-style: italic; }
    .num  { font-size: 16px; }
    .case { font-size: 17px; }
    .ax   { stroke: #181818; stroke-width: 1.6; fill: none; }
    .tick { stroke: #181818; stroke-width: 1.4; }
    .brace{ stroke: #181818; stroke-width: 1.4; fill: none; }
    .dot  { fill: #181818; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#181818"/>
    </marker>
  </defs>

  <!-- ============ case (I) : c = 0, a = b ============ -->
  <text class="case" x="14" y="72">(I)</text>

  <line class="ax" x1="70" y1="66" x2="690" y2="66" marker-end="url(#arrow)"/>
  <text class="lbl" x="706" y="72">&#8469;</text>

  <line class="tick" x1="110" y1="58" x2="110" y2="74"/>
  <line class="tick" x1="180" y1="58" x2="180" y2="74"/>
  <line class="tick" x1="250" y1="58" x2="250" y2="74"/>
  <line class="tick" x1="390" y1="58" x2="390" y2="74"/>
  <line class="tick" x1="530" y1="58" x2="530" y2="74"/>
  <line class="tick" x1="600" y1="58" x2="600" y2="74"/>

  <text class="num" x="110" y="95" text-anchor="middle">0</text>
  <text class="num" x="180" y="95" text-anchor="middle">1</text>
  <text class="num" x="250" y="95" text-anchor="middle">2</text>
  <text class="num" x="320" y="92" text-anchor="middle">&#183; &#183; &#183;</text>

  <circle class="dot" cx="460" cy="66" r="4.5"/>
  <text class="lbl" x="460" y="95" text-anchor="middle">a = b</text>
  <text class="lbl" x="460" y="42" text-anchor="middle">c = 0</text>

  <!-- ============ case (II) : c > 0, a + c = b ============ -->
  <text class="case" x="14" y="212">(II)</text>

  <line class="ax" x1="70" y1="206" x2="690" y2="206" marker-end="url(#arrow)"/>
  <text class="lbl" x="706" y="212">&#8469;</text>

  <line class="tick" x1="110" y1="198" x2="110" y2="214"/>
  <line class="tick" x1="180" y1="198" x2="180" y2="214"/>
  <line class="tick" x1="250" y1="198" x2="250" y2="214"/>
  <line class="tick" x1="390" y1="198" x2="390" y2="214"/>
  <line class="tick" x1="460" y1="198" x2="460" y2="214"/>

  <text class="num" x="110" y="235" text-anchor="middle">0</text>
  <text class="num" x="180" y="235" text-anchor="middle">1</text>
  <text class="num" x="250" y="235" text-anchor="middle">2</text>
  <text class="num" x="320" y="232" text-anchor="middle">&#183; &#183; &#183;</text>

  <circle class="dot" cx="390" cy="206" r="4.5"/>
  <circle class="dot" cx="530" cy="206" r="4.5"/>

  <text class="lbl" x="390" y="235" text-anchor="middle">a</text>
  <text class="lbl" x="460" y="235" text-anchor="middle">a+1</text>
  <text class="lbl" x="545" y="235" text-anchor="middle">a+c = b</text>

  <!-- brace spanning a .. b, labelled c -->
  <path class="brace" d="M 390 186
                         C 390 176, 396 176, 406 176
                         L 452 176
                         C 458 176, 458 172, 460 168
                         C 462 172, 462 176, 468 176
                         L 514 176
                         C 524 176, 530 176, 530 186"/>
  <text class="lbl" x="460" y="160" text-anchor="middle">c</text>
</svg>
