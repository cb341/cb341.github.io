<svg style="background:#fff" xmlns="http://www.w3.org/2000/svg" class="lean-proof-state" viewBox="0 0 868 1627" role="img" aria-labelledby="title desc">
<title id="title">Lean proof state overview</title>
<desc id="desc">The proof of total ordering splits by induction on y, then by cases of the induction hypothesis and the witness. Four branches close with exact or reflexivity.</desc>
<style>
  svg.lean-proof-state { color: #111; }
  svg.lean-proof-state .frame, svg.lean-proof-state .state { fill: #f9fafb; stroke: currentColor; stroke-width: 1.25; }
  svg.lean-proof-state .frame { fill: none; }
  svg.lean-proof-state .flow { fill: none; stroke: currentColor; stroke-width: 1.3; marker-end: url(#arrow); }
  svg.lean-proof-state .dot { fill: currentColor; }
  svg.lean-proof-state .end-ring { fill: none; stroke: currentColor; stroke-width: 1.2; }
  svg.lean-proof-state text { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 15px; text-anchor: middle; }
  svg.lean-proof-state .frame-title { font-size: 18px; }
  svg.lean-proof-state .edge-label { font-size: 14px; }
  @media (prefers-color-scheme: dark) {
    svg.lean-proof-state { background: #000 !important; color: #f5f5f5; }
    svg.lean-proof-state .state { fill: #1d1d23; }
    svg.lean-proof-state .frame { fill: none; }
    svg.lean-proof-state .svg-background { fill: #000; }
  }

</style>
<rect class="svg-background" width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
<rect class="frame" x="16" y="171" width="700" height="1387" rx="16"/>
<text class="frame-title" x="366" y="191">succ d  (hd : x≤d ∨ d≤x)</text>
<rect class="frame" x="27" y="502" width="274" height="981" rx="16"/>
<text class="frame-title" x="164" y="522">inl</text>
<rect class="frame" x="312" y="406" width="393" height="1077" rx="16"/>
<text class="frame-title" x="509" y="426">inr</text>
<path class="flow" d="M674 24 V72"/>
<path class="flow" d="M638 118 C600 137 578 157 567 171"/>
<text class="edge-label" x="649" y="155">induction y (succ d, hd)</text>
<path class="flow" d="M714 120 C743 144 764 173 775 195"/>
<text class="edge-label" x="795" y="156">induction y (0)</text>
<path class="flow" d="M785 246 L778 308"/>
<text class="edge-label" x="798" y="277">right</text>
<path class="flow" d="M771 356 C761 420 762 990 762 1539 C762 1579 741 1597 681 1609"/>
<text class="edge-label" x="809" y="999">exact zero_le x</text>
<path class="flow" d="M553 231 L462 308"/>
<path class="flow" d="M338 340 C219 365 177 411 177 502"/>
<text class="edge-label" x="255" y="460">cases hd (inl hl)</text>
<path class="flow" d="M437 357 V405"/>
<text class="edge-label" x="516" y="390">cases hd (inr hr)</text>
<path class="flow" d="M182 561 L175 638"/>
<path class="flow" d="M172 687 L169 749"/>
<text class="edge-label" x="239" y="723">cases&#x27; hl with c hc</text>
<path class="flow" d="M168 798 L165 859"/>
<text class="edge-label" x="198" y="834">rewrite[hc]</text>
<path class="flow" d="M158 908 L147 970"/>
<text class="edge-label" x="167" y="942">left</text>
<path class="flow" d="M140 1018 L121 1080"/>
<text class="edge-label" x="208" y="1054">rewrite[succ_eq_add_one]</text>
<path class="flow" d="M123 1129 L133 1225"/>
<text class="edge-label" x="162" y="1179">use c+1</text>
<path class="flow" d="M145 1273 L169 1336"/>
<text class="edge-label" x="232" y="1305">rewrite[← add_assoc]</text>
<path class="flow" d="M196 1385 L249 1448"/>
<text class="edge-label" x="232" y="1421">rfl</text>
<path class="flow" d="M437 465 V528"/>
<path class="flow" d="M437 577 V638"/>
<text class="edge-label" x="521" y="611">cases&#x27; hr with c hc</text>
<path class="flow" d="M424 687 L398 749"/>
<text class="edge-label" x="442" y="722">cases c (0)</text>
<path class="flow" d="M463 687 L535 749"/>
<text class="edge-label" x="562" y="722">cases c (succ a)</text>
<path class="flow" d="M366 798 L355 859"/>
<text class="edge-label" x="427" y="833">rewrite[add_zero d] at hc</text>
<path class="flow" d="M559 798 L546 859"/>
<text class="edge-label" x="627" y="833">rewrite[add_succ] at hc</text>
<path class="flow" d="M377 909 V970"/>
<text class="edge-label" x="392" y="940">left</text>
<path class="flow" d="M540 909 V970"/>
<text class="edge-label" x="564" y="940">right</text>
<path class="flow" d="M377 1018 V1154"/>
<text class="edge-label" x="413" y="1052">rewrite[hc]</text>
<path class="flow" d="M540 1018 V1081"/>
<text class="edge-label" x="579" y="1052">rewrite[hc]</text>
<path class="flow" d="M540 1130 V1225"/>
<text class="edge-label" x="563" y="1179">use a</text>
<path class="flow" d="M540 1273 L525 1336"/>
<text class="edge-label" x="598" y="1305">rewrite[succ_add]</text>
<path class="flow" d="M379 1202 L413 1447"/>
<text class="edge-label" x="462" y="1305">exact le_succ_self d</text>
<path class="flow" d="M495 1385 L424 1448"/>
<text class="edge-label" x="476" y="1421">rfl</text>
<path class="flow" d="M301 1481 L402 1526"/>
<path class="flow" d="M413 1473 V1521"/>
