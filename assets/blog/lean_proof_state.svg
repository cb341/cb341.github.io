<rect class="state" x="612" y="73" width="122" height="49" rx="16"/>
<text x="673.0" y="102.5">x ≤ y ∨ y ≤ x</text>
<rect class="state" x="727" y="197" width="122" height="49" rx="16"/>
<text x="788.0" y="226.5">x ≤ 0 ∨ 0 ≤ x</text>
<rect class="state" x="739" y="308" width="71" height="49" rx="16"/>
<text x="774.5" y="337.5">0 ≤ x</text>
<rect class="state" x="338" y="309" width="198" height="48" rx="16"/>
<text x="437.0" y="338.0">x ≤ succ d ∨ succ d ≤ x</text>
<rect class="state" x="390" y="528" width="95" height="49" rx="16"/>
<text x="437.5" y="548.5">…∨…</text>
<text x="437.5" y="566.5">(hr : d≤x)</text>
<rect class="state" x="374" y="638" width="126" height="49" rx="16"/>
<text x="437" y="658.5">…∨…</text>
<text x="437" y="676.5">(hc : x = d+c)</text>
<rect class="state" x="126" y="639" width="92" height="48" rx="16"/>
<text x="172.0" y="659.0">…∨…</text>
<text x="172.0" y="677.0">(hl : x≤d)</text>
<rect class="state" x="105" y="749" width="126" height="49" rx="16"/>
<text x="168.0" y="769.5">…∨…</text>
<text x="168.0" y="787.5">(hc : d = x+c)</text>
<rect class="state" x="323" y="749" width="127" height="49" rx="16"/>
<text x="386.5" y="769.5">…∨…</text>
<text x="386.5" y="787.5">(hc : x = d+0)</text>
<rect class="state" x="474" y="749" width="174" height="49" rx="16"/>
<text x="561.0" y="769.5">…∨…</text>
<text x="561.0" y="787.5">(hc : x = d + succ a)</text>
<rect class="state" x="37" y="860" width="254" height="49" rx="16"/>
<text x="164.0" y="889.5">x ≤ succ(x+c) ∨ succ(x+c) ≤ x</text>
<rect class="state" x="324" y="860" width="108" height="49" rx="16"/>
<text x="378.0" y="880.5">…∨…</text>
<text x="378.0" y="898.5">(hc : x = d)</text>
<rect class="state" x="456" y="860" width="171" height="49" rx="16"/>
<text x="541.5" y="880.5">…∨…</text>
<text x="541.5" y="898.5">(hc : x = succ(d+a))</text>
<rect class="state" x="78" y="970" width="127" height="49" rx="16"/>
<text x="141.5" y="999.5">x ≤ succ(x+c)</text>
<rect class="state" x="327" y="970" width="100" height="49" rx="16"/>
<text x="377.0" y="999.5">x ≤ succ d</text>
<rect class="state" x="490" y="970" width="100" height="49" rx="16"/>
<text x="540.0" y="999.5">succ d ≤ x</text>
<rect class="state" x="63" y="1081" width="113" height="49" rx="16"/>
<text x="119.5" y="1110.5">x ≤ (x+c)+1</text>
<rect class="state" x="457" y="1081" width="166" height="49" rx="16"/>
<text x="540.0" y="1110.5">succ d ≤ succ(d+a)</text>
<rect class="state" x="52" y="1225" width="168" height="49" rx="16"/>
<text x="136.0" y="1254.5">(x+c)+1 = x+(c+1)</text>
<rect class="state" x="327" y="1154" width="100" height="49" rx="16"/>
<text x="377.0" y="1183.5">d ≤ succ d</text>
<rect class="state" x="441" y="1225" width="197" height="49" rx="16"/>
<text x="539.5" y="1254.5">succ(d+a) = succ d + a</text>
<rect class="state" x="93" y="1336" width="196" height="49" rx="16"/>
<text x="191.0" y="1365.5">(x+c)+1 = (x+c)+1</text>
<rect class="state" x="423" y="1336" width="194" height="49" rx="16"/>
<text x="520.0" y="1365.5">succ(d+a) = succ(d+a)</text>
