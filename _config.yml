title: "Dani Bengl - Full-Stack Developer"
description: "Full-stack software developer specializing in Ruby on Rails, web applications, and modern development practices. Portfolio, blog, and projects."
url: "https://cb341.dev"
timezone: Europe/Zurich

permalink: /blog/:slug/

collections:
  projects:
    output: true
    permalink: /projects/:slug/
  gallery:
    output: true
    permalink: /gallery/:slug/
    sort_by: order
  threads:
    output: false
    sort_by: date

defaults:
  - scope:
      path: ""
    values:
      layout: base
  - scope:
      path: "_posts"
    values:
      layout: post

date_format: "%d.%m.%Y"

markdown: kramdown
kramdown:
  syntax_highlighter: none
  hard_wrap: true
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols: {mdash: "--", ndash: "--", hellip: "...", laquo: "<<", raquo: ">>", laquo_space: "<< ", raquo_space: " >>"}

plugins:
  - jekyll-sitemap

# Jekyll defaults to `no-store`, which prevents testing the browser's
# back/forward cache. Always revalidate local responses without disabling it.
webrick:
  headers:
    Cache-Control: no-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package-lock.json
  - package.json
  - bin/
  - design.md
